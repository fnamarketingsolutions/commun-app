# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Increased memory and metaspace for faster Kotlin & C++ CMake compilation
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC

# Enables parallel execution of decoupled subprojects across CPU cores
org.gradle.parallel=true

# Enables Gradle build cache to avoid rebuilding unchanged tasks
org.gradle.caching=true

# Enables file system watching to speed up incremental builds
org.gradle.vfs.watch=true

# AndroidX package structure
android.useAndroidX=true

# React Native Architectures:
# For development/debug, compile only 64-bit architectures (arm64-v8a for physical phones, x86_64 for emulators).
# This reduces C++ CMake compilation time by 50-75% compared to compiling all 4 ABIs!
# (If testing on a physical device only, you can even set it to just 'arm64-v8a').
reactNativeArchitectures=arm64-v8a,x86_64

# Use this property to enable or disable the Hermes JS engine.
hermesEnabled=true

# Edge-to-edge display support
edgeToEdgeEnabled=false